<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content panel</title>
<link rel="stylesheet" href="style.css">
<script src="shared.js"></script>
<style>
  body { font-size: 12px; padding: 0; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .seg.full { display: flex; width: 100%; } .seg.full button { flex: 1; padding: 4px 0; font-size: 12px; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 2px; gap: 4px; }
  .nav button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 5px; cursor: pointer; font: inherit; padding: 1px 8px; }
  .nav button#cur { flex: 1; color: var(--text); }
  .day { padding: 6px 0 6px 0; border-bottom: 1px solid var(--line); } .day:last-of-type { border-bottom: 0; }
  .day.today { border-left: 2px solid var(--run); padding-left: 6px; }
  .dh { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 11px; }
  .v { display: flex; gap: 6px; align-items: flex-start; margin-top: 2px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .v .dot { margin: 4px 0 0; flex: none; }
  .v small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; } .v small.warn { color: var(--gym); }
  .v.open { color: var(--gym); font-weight: 400; font-style: italic; } .v.open.past { color: var(--muted); }
  h4 { margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  h4:first-child { margin-top: 8px; }
  .r b.bad { color: var(--bad); } .li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 34px; margin-top: 4px; }
  .bars i { flex: 1; background: var(--run); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
  .tb { height: 4px; background: var(--line); border-radius: 2px; display: flex; overflow: hidden; margin: 2px 0 6px; } .tb i { display: block; height: 100%; }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; margin: 0 4px 4px 0; font-size: 11px; }
</style>
</head>
<body>
<div id="msg" class="msg" hidden></div>
<div class="panel" id="out" hidden>
  <div class="seg full" id="tabs"><button data-t="week" class="on">Week</button><button data-t="ins">Insights</button></div>
  <div id="view"></div>
</div>
<script>
(async () => {
  const msg = (h) => { $("#msg").innerHTML = h; $("#msg").hidden = false; };
  const e = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const NC = { default: "#9b9a97", gray: "#9b9a97", brown: "#a98a6a", orange: "#d9730d", yellow: "#cb912f", green: "#4dab9a", blue: "#529cca", purple: "#9a6dd7", pink: "#e255a1", red: "#ff7369" };
  let D;
  try { const r = await fetch("content.json?v=" + Date.now()); if (!r.ok) throw 0; D = await r.json(); }
  catch { return msg("<b>No content data yet.</b> Run the “Build and deploy dashboard” workflow."); }
  if (!D.has_db) return msg("<b>Content data unavailable.</b> Add the <b>NOTION_VIDEO_DB</b> and <b>NOTION_TEMPLATES_DB</b> secrets, share both databases with the integration and re-run the workflow.");
  $("#out").hidden = false;

  const today = todayUK(), ideas = D.ideas, DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const pubOf = (x) => (x.pub != null ? x.pub : !!x.d && x.d < today);   // no Published checkbox: a past Post Date counts as posted
  const col = {}; D.types.forEach((t) => (col[t.name] = NC[t.color] || NC.default));
  const dowOf = (n) => (n ? DOW.findIndex((d) => n.toLowerCase().startsWith(d.toLowerCase())) : -1);
  const slotOf = DOW.map((_, i) => (D.types.find((t) => dowOf(t.name) === i) || {}).name || null);
  const short = (n) => (n ? n.replace(/^[A-Za-z]{3}\s*-\s*/, "") : "");
  let off = 0, tab = "week";

  function week() {
    const ws = addDays(monday(today), off * 7), ds = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
    let covered = 0;
    const rows = ds.map((d, i) => {
      const v = ideas.filter((x) => x.d === d);
      if (v.length) covered++;
      const body = v.length ? v.map((x) => {
        const offSlot = dowOf(x.type) >= 0 && dowOf(x.type) !== i, name = x.t || x.type || "Video";
        return `<div class="v" title="${e(name)}"><span class="dot" style="background:${col[x.type] || NC.default}"></span><span>${pubOf(x) ? "✓ " : ""}${e(name)}${x.t && x.type ? `<small class="${offSlot ? "warn" : ""}">${e(short(x.type))}${offSlot ? " · off-slot" : ""}</small>` : ""}</span></div>`;
      }).join("") : `<div class="v open${d < today ? " past" : ""}">${d < today ? "No video" : "Open slot"}</div>`;
      return `<div class="day${d === today ? " today" : ""}"><div class="dh"><span>${DOW[i]} ${label(d).split(" ")[0]}</span><span>${e(short(slotOf[i]))}</span></div>${body}</div>`;
    }).join("");
    $("#view").innerHTML = `<div class="nav"><button id="pv">‹</button><button id="cur" title="Back to this week">${label(ds[0])} – ${label(ds[6])}</button><button id="nx">›</button></div>${rows}<div class="d" style="margin-top:6px">${covered} of 7 days have a video</div>`;
    $("#pv").onclick = () => { off--; week(); }; $("#nx").onclick = () => { off++; week(); }; $("#cur").onclick = () => { off = 0; week(); };
  }

  function insights() {
    const planned = ideas.filter((x) => !pubOf(x)), posted = ideas.filter(pubOf);
    const backlog = planned.filter((x) => !x.d), upcoming = planned.filter((x) => x.d && x.d >= today).sort((a, b) => a.d.localeCompare(b.d));
    const overdue = planned.filter((x) => x.d && x.d < today), race = ideas.filter((x) => x.race);
    const R = (k, v, c = "") => `<div class="li" style="padding:3px 0"><span>${k}</span><span class="r"><b class="${c}">${v}</b></span></div>`;
    const next7 = Array.from({ length: 7 }, (_, i) => addDays(today, i)).filter((d) => ideas.some((x) => x.d === d)).length;
    const nx = upcoming[0];

    // Posted per week, last 8 weeks
    const wks = Array.from({ length: 8 }, (_, i) => addDays(monday(today), -7 * (7 - i)));
    const per = wks.map((w) => posted.filter((x) => x.d && monday(x.d) === w).length), mx = Math.max(1, ...per);

    // By content type
    const names = D.types.map((t) => t.name); if (ideas.some((x) => !x.type)) names.push("Unassigned");
    const tr = names.map((n) => { const r = ideas.filter((x) => (x.type || "Unassigned") === n); return { n, pl: r.filter((x) => !pubOf(x)).length, po: r.filter(pubOf).length }; });
    const tmx = Math.max(1, ...tr.map((t) => t.pl + t.po));

    // Templates
    const tu = D.templates.map((n) => ({ n, pl: planned.filter((x) => x.tmpl.includes(n)).length, all: ideas.filter((x) => x.tmpl.includes(n)).length }))
      .sort((a, b) => b.pl - a.pl || b.all - a.all || a.n.localeCompare(b.n));
    const none = ideas.filter((x) => !x.tmpl.length).length;
    const needs = D.types.filter((t) => dowOf(t.name) >= 0 && !backlog.some((x) => x.type === t.name));

    $("#view").innerHTML = `
      <h4>Pipeline</h4>${R("Backlog (no date)", backlog.length)}${R("Scheduled", upcoming.length)}${overdue.length ? R("Overdue", overdue.length, "bad") : ""}${R("Posted", posted.length)}${R("Race videos", `${race.filter((x) => !pubOf(x)).length} planned / ${race.length}`)}
      <h4>Next 7 days</h4>${R("Days with a video", next7 + " / 7")}${nx ? `<div class="d" style="margin-top:2px">Next: ${e(nx.t || nx.type || "Video")} · ${DOW[(new Date(nx.d + "T00:00:00Z").getUTCDay() + 6) % 7]} ${label(nx.d)}</div>` : '<div class="d">Nothing scheduled ahead.</div>'}
      <h4>Posted per week</h4><div class="bars">${per.map((n, i) => `<i style="height:${(n / mx) * 100}%" title="w/c ${label(wks[i])}: ${n}"></i>`).join("")}</div>
      <div class="d" style="margin-top:3px">Avg ${(sum(per, (x) => x) / 8).toFixed(1)} per week over 8 weeks</div>
      <h4>By content type</h4>${tr.map((t) => `<div class="li" style="border:0;padding:2px 0 0"><span><span class="dot" style="background:${col[t.n] || NC.default}"></span>${e(short(t.n) || t.n)}</span><span class="r"><b>${t.pl}</b> <small style="display:inline">planned</small></span></div>
        <div class="tb"><i style="width:${(t.pl / tmx) * 100}%;background:${col[t.n] || NC.default}"></i><i style="width:${(t.po / tmx) * 100}%;background:${col[t.n] || NC.default};opacity:.3"></i></div>`).join("")}
      <h4>Templates</h4>${tu.slice(0, 5).map((u) => `<div class="li" style="padding:3px 0"><span title="${e(u.n)}">${e(u.n)}</span><span class="r"><b>${u.pl}</b> <small style="display:inline">/ ${u.all}</small></span></div>`).join("") || '<div class="d">No templates yet.</div>'}
      <div class="d" style="margin-top:3px">${tu.length} templates · ${tu.filter((u) => !u.all).length} unused · ${none} of ${ideas.length} ideas have none</div>
      <h4>Needs ideas</h4>${needs.length ? needs.map((t) => `<span class="chip" style="border-color:${col[t.name] || NC.default}">${e(short(t.name))}</span>`).join("") : '<div class="d">Every day slot has an idea waiting.</div>'}
      <div class="d" style="margin-top:8px;text-align:right">Updated ${new Date(D.generated_at).toLocaleString("en-GB", { timeZone: "Europe/London", dateStyle: "short", timeStyle: "short" })}</div>`;
  }

  const show = () => (tab === "week" ? week() : insights());
  document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => {
    tab = b.dataset.t;
    document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
    show();
  }));
  show();
})();
</script>
</body>
</html>
