<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side panel</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="shared.js"></script>
</head>
<body class="side">
<div id="msg" class="msg" hidden></div>
<div id="out" hidden>
  <div class="card">
    <h3>Progress, last 12 weeks</h3>
    <div class="seg" id="tabs" style="width:100%;margin-bottom:10px">
      <button data-k="run" class="on" style="flex:1">Running</button>
      <button data-k="cardio" style="flex:1">Cardio</button>
      <button data-k="gym" style="flex:1">Gym</button>
    </div>
    <div class="box" style="height:190px"><canvas id="trend"></canvas></div>
    <div class="d" id="trendNote" style="margin-top:8px"></div>
  </div>
  <div class="card"><h3>Recent sessions</h3><div id="recent"></div></div>
  <div class="card" id="liftCard">
    <div class="row" style="margin-bottom:8px"><h3 style="margin:0">Lift records</h3><select id="liftSel" aria-label="Exercise"></select></div>
    <div id="lifts"></div>
    <div class="d" style="margin-top:8px">Weights as recorded in Hevy (dumbbell lifts are per dumbbell). 1RM is estimated (Epley).</div>
  </div>
</div>
<script>
(async () => {
  const D = await loadData(); if (!D) return;
  $("#out").hidden = false;
  const C = colours();
  Chart.defaults.color = css("--muted");
  Chart.defaults.borderColor = css("--line");
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.font.size = 11;

  // 15 weeks of stats so the 4-week average is complete from the first plotted week
  const tw = monday(todayUK());
  const weeks = Array.from({ length: 15 }, (_, i) => addDays(tw, -7 * (14 - i)));
  const stats = weeks.map((w) => weekStats(D, w));
  const METRICS = {
    run: { k: "km", unit: "km", d: 1, col: C.run },
    cardio: { k: "cardio", unit: "h", d: 1, col: C.cardio },
    gym: { k: "gym", unit: "sessions", d: 0, col: C.gym },
  };
  let chart;
  function show(key) {
    const m = METRICS[key], vals = stats.map((s) => s[m.k]);
    const avg = vals.map((_, i) => (i < 3 ? null : vals.slice(i - 3, i + 1).reduce((a, b) => a + b, 0) / 4));
    chart?.destroy();
    chart = new Chart($("#trend"), {
      type: "line",
      data: { labels: weeks.slice(3).map(label), datasets: [
        { label: "Weekly", data: vals.slice(3), borderColor: m.col, backgroundColor: m.col + "22", fill: true, tension: 0.25, pointRadius: 2.5 },
        { label: "4-week avg", data: avg.slice(3), borderColor: m.col, borderDash: [5, 4], pointRadius: 0, tension: 0.25, fill: false },
      ] },
      options: { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${num(c.parsed.y, m.d)} ${m.unit}` } } },
        scales: { y: { beginAtZero: true, ticks: m.d === 0 ? { precision: 0 } : {} }, x: { ticks: { maxTicksLimit: 6 } } } },
    });
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.k === key));
    $("#trendNote").textContent = `Weekly ${m.unit} (solid) and 4-week average (dashed). The latest week is still in progress.`;
  }
  document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => show(b.dataset.k)));
  show("run");

  // Latest 6 sessions across activities and gym (no names are exported)
  const items = [
    ...D.activities.map((a) => ({ d: a.d, t: a.type, c: groupOf(a.type) === "Run" ? "run" : "cardio",
      s: [a.km > 0 ? num(a.km) + " km" : "", a.min ? Math.round(a.min) + " min" : ""].filter(Boolean).join(" · ") })),
    ...D.gym.map((g) => ({ d: g.d, t: "Gym", c: "gym",
      s: [g.min ? Math.round(g.min) + " min" : "", g.vol ? num(g.vol, 0) + " kg" : ""].filter(Boolean).join(" · ") })),
  ].sort((x, y) => y.d.localeCompare(x.d)).slice(0, 6);
  $("#recent").innerHTML = items.map((i) =>
    `<div class="li ${i.c}"><span><span class="dot"></span>${i.t}<small>${label(i.d)}</small></span><span class="r">${i.s || "–"}</span></div>`).join("");

  // Lift records: pick any exercise that exists in Key Lifts
  const names = [...new Set(D.lifts.map((l) => l.ex))];
  const rank = (n) => (MAIN_LIFTS.includes(n) ? MAIN_LIFTS.indexOf(n) : 99);
  names.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  if (!names.length) $("#liftCard").remove();
  else {
    $("#liftSel").innerHTML = names.map((n) => `<option>${n}</option>`).join("");
    const showLift = () => {
      const r = D.lifts.filter((l) => l.ex === $("#liftSel").value).sort((a, b) => a.d.localeCompare(b.d));
      const best = (f) => r.reduce((b, l) => (l[f] != null && (!b || l[f] > b[f]) ? l : b), null);
      const top = best("kg"), est = best("e1rm"), last = r[r.length - 1];
      const set = (l) => (l ? `${num(l.kg)} kg${l.reps ? " × " + l.reps : ""}` : "–");
      const row = (k, v, sub) => `<div class="li"><span>${k}</span><span class="r"><b>${v}</b>${sub ? `<small>${sub}</small>` : ""}</span></div>`;
      $("#lifts").innerHTML =
        row("Best est. 1RM", num(est?.e1rm) + " kg", est ? label(est.d) : "") +
        row("Heaviest top set", set(top), top ? label(top.d) : "") +
        row("Latest session", set(last), last ? label(last.d) : "") +
        row("Sessions logged", r.length, "");
    };
    $("#liftSel").onchange = showLift;
    showLift();
  }
})();
</script>
</body>
</html>
